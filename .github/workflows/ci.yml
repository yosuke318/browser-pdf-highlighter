name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # 実データらしいPDF・画像が入っていないか
      - run: npm run check:files
      # ダミーPDFのページの種類と、正解データの形式の確認
      - run: npm run samples:check
      # ユニットテストと、ダミーPDFを使ったリグレッションテスト(src/regression/)
      - run: npm test
      - run: npm run build
      - run: npm run check:build
      # PDFの処理中に外部ドメインへの通信がないこと(E2E。ランナーに入っている Google Chrome を使う)
      - run: npm run test:e2e
      # チェックをすべて通ったビルドを、そのままデプロイに使う
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist
          retention-days: 7

  # main にpushされ、上のチェックがすべて通ったら Cloudflare Pages にデプロイする(docs/deploy-cloudflare.md)。
  # リポジトリの変数 CLOUDFLARE_PAGES_PROJECT(Pages のプロジェクト名)を設定するまでは動かない
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    # デプロイが重なったときは、順番に行う(途中で止めない)
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
