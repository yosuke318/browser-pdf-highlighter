name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # 実データらしいPDF・画像が入っていないか
      - run: npm run check:files
      # ダミーPDFのページの種類と、正解データの形式の確認
      - run: npm run samples:check
      # ユニットテストと、ダミーPDFを使ったリグレッションテスト(src/regression/)
      - run: npm test
      - run: npm run build
      - run: npm run check:build
